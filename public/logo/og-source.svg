      fill="#FAF7F2"
      letter-spacing="-3.5"
    >Barbe</text>
    <g transform="translate(298 8)">
      <rect x="6" y="10" width="22" height="92" rx="5" fill="#FAF7F2"/>
      <rect x="44" y="10" width="22" height="92" rx="5" fill="#FAF7F2"/>
      <circle cx="-4" cy="56" r="11" fill="#C9861B"/>
      <rect x="4" y="50" width="64" height="12" rx="6" fill="#C9861B"/>
      <circle cx="76" cy="56" r="11" fill="#C9861B"/>
