<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#1B5E3C"/>
  <!-- Wordmark centered (geometric Barbe + ll + ist) -->
  <g transform="translate(210 230)">
    <!-- Barbe as paths approximated with bold text fallback + LL geometry -->
    <text
      x="0"
      y="95"
