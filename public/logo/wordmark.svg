<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none" role="img" aria-label="Barbellist">
  <!-- Primary wordmark: Barbe + ll(with barbell) + ist -->
  <text
    x="0"
    y="68"
    font-family="Outfit, Saira, Geist, system-ui, sans-serif"
    font-weight="700"
    font-size="72"
    fill="#1B5E3C"
    letter-spacing="-2.2"
  >Barbe</text>
  <!-- ll stems positioned after "Barbe" (~172px at 72px) -->
  <g transform="translate(188 12)">
    <rect x="4" y="6" width="14" height="60" rx="3" fill="#1B5E3C"/>
    <rect x="28" y="6" width="14" height="60" rx="3" fill="#1B5E3C"/>
    <circle cx="-2" cy="36" r="7" fill="#C9861B"/>
    <rect x="3" y="32.5" width="40" height="7" rx="3.5" fill="#C9861B"/>
    <circle cx="48" cy="36" r="7" fill="#C9861B"/>
  </g>
  <text
    x="250"
    y="68"
    font-family="Outfit, Saira, Geist, system-ui, sans-serif"
    font-weight="700"
    font-size="72"
    fill="#1B5E3C"
    letter-spacing="-2.2"
  >ist</text>
</svg>
