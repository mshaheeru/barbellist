<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;members&quot;,&quot;staff&quot;,&quot;attendance&quot;,&quot;fees&quot;,&quot;inventory&quot;,&quot;expenses&quot;,&quot;packages&quot;,&quot;cards&quot;,&quot;reports&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dashboard';
    const base = { display:'flex', alignItems:'center', gap:'12px', padding:'9.5px 14px', borderRadius:'10px', fontSize:'14px' };
    const on = Object.assign({}, base, { background:'#1B5E3C', color:'#fff', fontWeight:600 });
    const off = Object.assign({}, base, { background:'transparent', color:'#A9C4B4', fontWeight:500 });
    const s = k => (active === k ? on : off);
    return {
      sDashboard:s('dashboard'), sMembers:s('members'), sStaff:s('staff'), sAttendance:s('attendance'),
      sFees:s('fees'), sInventory:s('inventory'), sExpenses:s('expenses'), sPackages:s('packages'),
      sCards:s('cards'), sReports:s('reports'), sSettings:s('settings')
    };
  }
}
</script>
